<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Samriddhi - Page 5</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <form action="https://formsubmit.co/sahanaireet@gmail.com" method="POST" id="noteForm">
            <div>
                <div class="header-tag">Leave a Note 💌</div>
                <p class="note">I knew you would not disappoint 🥰. So you can leave a note for me here. Happy Birthday in Advance 🎈🥳.</p>

                <!-- Hidden inputs to send gift choice and email subject automatically -->
                <input type="hidden" name="_subject" value="Samriddhi's Birthday Website Submission!">
                <input type="hidden" name="Selected Gift" id="hiddenGiftField">
                <input type="hidden" name="_next" value="page6.html">

                <textarea name="Samriddhi Note" rows="7" maxlength="6000" placeholder="Type your note here for Swinky (up to 1000 words)..." required></textarea>
            </div>

            <div class="bottom-left-container">
                <button type="submit" class="btn-next">Send & Finish ➔</button>
            </div>
        </form>
    </div>

    <script>
        // Retrieve her gift choice from Page 4 and attach it to the email form
        const savedGift = localStorage.getItem('samriddhiSelectedGift') || "No gift selected";
        document.getElementById('hiddenGiftField').value = savedGift;
    </script>

</body>
</html>
