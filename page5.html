<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Birthday Note - Page 5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Leave a Special Message! 💬</h2>
    <p class="subtitle">I knew you would not disappoint 🥰. So you can leave a note for me here. Happy Birthday in Advance 🎈🥳.</p>

    <!-- FormSubmit Action -->
    <form action="https://formsubmit.co/sahanaireet@gmail.com" method="POST">
      <!-- FormSubmit Settings -->
      <input type="hidden" name="_subject" value="Samriddhi's Birthday Gift Choice & Message! 🎂">
      <input type="hidden" name="_captcha" value="false">
      
      <!-- Exact Redirect URL -->
      <input type="hidden" name="_next" value="https://sahanaireet-oss.github.io/samriddhi-birthday/page6.html">

      <!-- Hidden Input to capture gifts saved from Page 4 -->
      <input type="hidden" id="selectedGiftsInput" name="Selected Gifts from Page 4" value="None selected">

      <!-- Personal Message Section -->
      <div class="question-group">
        <label for="birthdayNote">Leave a note / message for me 💬:</label>
        <textarea id="birthdayNote" name="Personal Message" rows="5" placeholder="Write anything you want here..." required></textarea>
      </div>

      <button type="submit" class="btn">Finish & Go to Final Page ➡️</button>
    </form>
  </div>

  <script>
    // Retrieve gift selections saved from page4.html
    const savedGifts = localStorage.getItem('samriddhiSelectedGift');
    if (savedGifts) {
      document.getElementById('selectedGiftsInput').value = savedGifts;
    }
  </script>
</body>
</html>
