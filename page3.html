<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questions for You - Page 3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>A Few Questions for You! 💖</h2>
    <p class="subtitle">Answer these questions before moving to the next page!</p>
    
    <!-- FormSubmit Action -->
    <form action="https://formsubmit.co/sahanaireet@gmail.com" method="POST">
      <!-- FormSubmit Configuration -->
      <input type="hidden" name="_subject" value="New Birthday Quiz Answers from Samriddhi! 🎉">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="page4.html">

      <div class="question-group">
        <label for="q1">1) What's your nickname / full name?</label>
        <input type="text" id="q1" name="1. Nickname or Full Name" placeholder="Type your answer here..." required>
      </div>

      <div class="question-group">
        <label for="q2">2) What's your favourite colour (I know but still)?</label>
        <input type="text" id="q2" name="2. Favourite Colour" placeholder="Type your favourite colour..." required>
      </div>

      <div class="question-group">
        <label for="q3">3) What's your favourite food?</label>
        <input type="text" id="q3" name="3. Favourite Food" placeholder="Type your favourite food..." required>
      </div>

      <div class="question-group">
        <label for="q4">4) What's your favourite song?</label>
        <input type="text" id="q4" name="4. Favourite Song" placeholder="Type your favourite song..." required>
      </div>

      <div class="question-group">
        <label for="q5">5) What's your favourite anime (I know)?</label>
        <input type="text" id="q5" name="5. Favourite Anime" placeholder="Type your favourite anime..." required>
      </div>

      <div class="question-group">
        <label for="q6">6) What's your favourite anime character (I know)?</label>
        <input type="text" id="q6" name="6. Favourite Anime Character" placeholder="Type your favourite character..." required>
      </div>

      <div class="question-group">
        <label for="q7">7) What anime are you currently watching?</label>
        <input type="text" id="q7" name="7. Currently Watching Anime" placeholder="Type what you're watching..." required>
      </div>

      <div class="question-group">
        <label for="q8">8) Did you like this website?</label>
        <input type="text" id="q8" name="8. Did you like this website?" placeholder="Tell me what you think..." required>
      </div>

      <div class="question-group">
        <label for="q9">9) Messi or Ronaldo? (Please select Messi)</label>
        <input type="text" id="q9" name="9. Messi or Ronaldo?" placeholder="Messi or Ronaldo?" required>
      </div>

      <div class="question-group">
        <label for="q10">10) Your favourite animal?</label>
        <input type="text" id="q10" name="10. Favourite Animal" placeholder="Type your favourite animal..." required>
      </div>

      <button type="submit" class="btn">Next Page ➡️</button>
    </form>
  </div>
</body>
</html>
